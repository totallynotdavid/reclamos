name: API

on:
  push:
    paths:
      - "apps/api/**"
      - "packages/eval/**"
      - "pyproject.toml"
      - "uv.lock"
      - "mise.toml"
      - "docker-compose.yml"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/eval/**"
      - "pyproject.toml"
      - "uv.lock"
      - "mise.toml"
      - "docker-compose.yml"
      - ".github/workflows/api.yml"

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.0
      - run: sudo apt-get update
      - run:
          sudo apt-get install --yes --no-install-recommends poppler-utils
          tesseract-ocr tesseract-ocr-spa
      - run: mise run api:lint
      - run: mise run api:typecheck
      - run: mise run api:test

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.0
      - run: mise run eval:lint
      - run: mise run eval:typecheck
      - run: mise run eval:test
