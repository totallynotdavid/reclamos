services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: reclamos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reclamos"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/reclamos
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "reclamos_api.worker"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/reclamos
      WORKER_ID: compose-worker
      PDF_STORE_PATH: /data/pdfs
    volumes:
      - pdfs:/data/pdfs
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  pdfs:
