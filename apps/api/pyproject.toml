[project]
name = "reclamos-api"
version = "0.1.0"
description = "FastAPI service for Reclamos"
requires-python = ">=3.13,<3.14"
dependencies = [
  "asyncpg>=0.32.0",
  "boto3>=1.43.114",
  "fastapi>=0.116.0",
  "fastembed>=0.9.0",
  "httpx>=0.28.1",
  "reclamos-eval",
  "rqueue @ git+https://github.com/totallynotdavid/rqueue.git@36dc2d9c8f53c2273fa61a8f6e3c8c2f0d98cd00",
  "selectolax>=1.0.0",
  "uvicorn[standard]>=0.54.0",
]

[tool.uv.sources]
reclamos-eval = { workspace = true }

[project.scripts]
reclamos = "reclamos_api.cli:main"

[dependency-groups]
dev = [
  "basedpyright>=1.39.9",
  "moto[server]>=5.2.4",
  "pytest>=9.0.0",
  "testcontainers[postgres]>=4.13.0",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "reclamos_api"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: uses a disposable PostgreSQL database"]
