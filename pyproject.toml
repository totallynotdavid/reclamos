[project]
name = "reclamos-workspace"
version = "0.1.0"
requires-python = ">=3.13,<3.14"

[tool.uv.workspace]
members = ["apps/api", "packages/eval"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
  "asyncpg-stubs>=0.32.0",
  "basedpyright>=1.39.9",
  "boto3-stubs-lite[s3]>=1.43.114",
  "httpx2>=2.13.1",
  "pytest>=9.0.0",
  "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = ["integration: uses a disposable PostgreSQL database"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
extraPaths = ["apps/api/src", "packages/eval/src"]
